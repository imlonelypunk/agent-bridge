name: Publish IDE extension

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ide-extension
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check release tag and default branch
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install locked release tools
        run: npm ci --ignore-scripts

      - name: Generate icon and test
        run: npm run build:icon && npm test

      - name: Test Python bridge
        working-directory: .
        run: python3 -m unittest discover -s tests -v

      - name: List package contents
        run: npx --no-install vsce ls

      - name: Build VSIX
        run: npx --no-install vsce package --no-dependencies

      - name: Verify packaged runtime round trip
        env:
          VSIX_VERSION: ${{ steps.meta.outputs.version }}
        run: python3 ./scripts/verify_vsix.py "agent-bridge-${VSIX_VERSION}.vsix"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-bridge-vsix
          path: ide-extension/agent-bridge-${{ steps.meta.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 30

  attach-release-asset:
    needs: package
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXTENSION_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-bridge-vsix
          path: ide-extension

      - name: Attach VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" "ide-extension/agent-bridge-${EXTENSION_VERSION}.vsix" --clobber

  publish-marketplace:
    needs: package
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: marketplace
    defaults:
      run:
        working-directory: ide-extension
    permissions:
      contents: read
      id-token: write
    env:
      EXTENSION_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install locked release tools
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-bridge-vsix
          path: ide-extension

      - name: Publish to Visual Studio Marketplace
        run: npx --no-install vsce publish --oidc --packagePath "agent-bridge-${EXTENSION_VERSION}.vsix"

  publish-open-vsx:
    needs: package
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: open-vsx
    defaults:
      run:
        working-directory: ide-extension
    permissions:
      contents: read
      id-token: write
    env:
      EXTENSION_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install locked release tools
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-bridge-vsix
          path: ide-extension

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          package="agent-bridge-${EXTENSION_VERSION}.vsix"
          if [ -n "$OVSX_PAT" ]; then
            npx --no-install ovsx publish "$package"
          else
            npx --no-install ovsx publish "$package" --trusted-publishing
          fi
